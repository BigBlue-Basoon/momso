[package]
name = "momso-server-providers"
version = "0.1.0"
edition = "2021"

[features]
test-fixtures = []

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
momso-saved-login-core = { path = "../desktop/src-tauri/saved-login-core" }
momso-server-browser = { path = "../server-browser" }
momso-server-crm = { path = "../server-crm" }

[dev-dependencies]
age = "0.12.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
momso-server-browser = { path = "../server-browser", features = ["fixture-loopback"] }
