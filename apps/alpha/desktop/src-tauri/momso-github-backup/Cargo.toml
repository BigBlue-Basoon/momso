[package]
name = "momso-github-backup"
version = "0.1.1"
edition = "2021"

[features]
test-fixtures = []

[dependencies]
base64 = "0.22"
libc = "0.2"
momso-core = { path = "../momso-core" }
momso-saved-login-core = { path = "../saved-login-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
age = "0.12.1"
