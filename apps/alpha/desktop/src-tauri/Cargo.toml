[package]
name = "momso-desktop"
version = "0.1.1"
description = "Local-first Windows alpha for momso"
authors = ["MOW", "BigBlue"]
license = "PolyForm-Shield-1.0.0"
edition = "2021"

[features]
g61-test-probe = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "momso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
age = "0.12.1"
chrono = "0.4"
flate2 = "1"
hmac = "0.12.1"
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }
log = "0.4"
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "=2.12.0"
semver = "1"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-util = "0.7"
tungstenite = "0.28"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-segmentation = "1"
walkdir = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
scraper = { version = "0.24", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
