[package]
name = "momso-saved-login-core"
version = "0.1.1"
edition = "2021"

[dependencies]
age = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
sha2 = "0.10"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "3"
