name: Public document links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '*.md'
      - 'scripts/check-public-markdown-links.py'
      - 'scripts/test_public_markdown_links.py'
      - 'scripts/requirements-public-docs.txt'
      - '.github/workflows/public-document-links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '*.md'
      - 'scripts/check-public-markdown-links.py'
      - 'scripts/test_public_markdown_links.py'
      - 'scripts/requirements-public-docs.txt'
      - '.github/workflows/public-document-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    if: github.repository == 'BigBlue-Basoon/momso'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check public Markdown links
        run: |
          python3 -m pip install -r scripts/requirements-public-docs.txt
          python3 -m unittest discover -s scripts -p test_public_markdown_links.py
          python3 scripts/check-public-markdown-links.py
